name: Build Audioware for CP2077 2.5 (unofficial)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  RED4EXT_RS_REV: d419d98d8b81a19a62585d11759fabdeabeb0957

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as-is
        run: git config --global core.autocrlf false

      - name: Checkout Audioware
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout red4ext-rs
        uses: actions/checkout@v4
        with:
          repository: jac3km4/red4ext-rs
          ref: ${{ env.RED4EXT_RS_REV }}
          path: red4ext-rs
          submodules: recursive

      - name: Backport 2.5 changes onto the SDK that red4ext-rs expects
        run: |
          cd red4ext-rs/deps/RED4ext.SDK
          git log --oneline -1
          git apply --ignore-whitespace "$GITHUB_WORKSPACE/sdk-2.5.patch"
          git diff --stat | tail -3

      - name: Enlarge callback buffer (32 -> 64 bytes)
        run: |
          f=red4ext-rs/src/types/callback.rs
          sed -i 's/\[u8; 0x20\]/[u8; 0x40]/; s/\[0u8; 0x20\]/[0u8; 0x40]/' "$f"
          grep -n "0x40" "$f"

      - name: Point Audioware at the patched red4ext-rs
        run: |
          sed -i 's|^red4ext-rs = .*|red4ext-rs = { path = "red4ext-rs" }|' Cargo.toml
          grep -n "^red4ext-rs" Cargo.toml

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release -p audioware

      - name: Collect output
        run: |
          mkdir -p out
          cp target/release/audioware.dll out/
          cp target/release/audioware.pdb out/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: audioware-2.5-unofficial
          path: out/
